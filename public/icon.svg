<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- CineTrack mark: film strip crossing a play triangle -->
  <rect width="1024" height="1024" rx="230" fill="#161616"/>
  <!-- play triangle -->
  <path d="M318 226 Q300 215 300 242 L300 782 Q300 809 318 798 L806 530 Q826 512 806 494 Z" fill="#F5C518"/>
  <!-- frame interior: blanks the triangle inside the strip window -->
  <rect x="312" y="392" width="330" height="240" fill="#161616"/>
  <!-- strip bands -->
  <g fill="#F5C518">
    <rect x="168" y="360" width="688" height="66"/>
    <rect x="168" y="598" width="688" height="66"/>
    <!-- left leader edge -->
    <rect x="168" y="360" width="36" height="304"/>
  </g>
  <!-- perforations -->
  <g fill="#161616">
    <g id="holes">
      <rect x="216" y="376" width="34" height="34" rx="6"/>
      <rect x="272" y="376" width="34" height="34" rx="6"/>
      <rect x="328" y="376" width="34" height="34" rx="6"/>
      <rect x="384" y="376" width="34" height="34" rx="6"/>
      <rect x="440" y="376" width="34" height="34" rx="6"/>
      <rect x="496" y="376" width="34" height="34" rx="6"/>
      <rect x="552" y="376" width="34" height="34" rx="6"/>
      <rect x="608" y="376" width="34" height="34" rx="6"/>
      <rect x="664" y="376" width="34" height="34" rx="6"/>
      <rect x="720" y="376" width="34" height="34" rx="6"/>
      <rect x="776" y="376" width="34" height="34" rx="6"/>
    </g>
    <use href="#holes" y="222"/>
  </g>
</svg>
