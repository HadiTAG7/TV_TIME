name: Deploy to Vercel

on:
  push:
    branches: [main, claude/tv-time-alternative-app-90wp8t]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Skips quietly when the VERCEL_TOKEN secret hasn't been added yet.
      - name: Deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_nRoRPm4518GaBLAok7QyMzH7
          VERCEL_PROJECT_ID: prj_6PI67xnY9FsvKym8qJPJhe1HF9t1
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "VERCEL_TOKEN secret not set — skipping Vercel deploy."
            exit 0
          fi
          npx vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          npx vercel build --prod --token="$VERCEL_TOKEN"
          npx vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
